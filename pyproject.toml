[project]
name = "obagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click",
    "mistralai>=2",
    "openai>=2.21.0",
    "pypinyin>=0.55.0",
    "questionary",
]

[project.scripts]
obagent = "obagent.cli:cli"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.2",
    "ty>=0.0.1a7",
]
